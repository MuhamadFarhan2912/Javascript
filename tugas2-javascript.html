<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 - JavaScript</title>

    <style>
        table {
            border-collapse: collapse;
            width: 80%;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #ddd;
        }
        tfoot {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Data Pegawai</h1>

    <script>

        let namaPegawai = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "Manajer";
        let status = "Menikah";

        let gajiPokok;

        if (jabatan == "Manajer") {
            gajiPokok = 15000000;
        } else if (jabatan == "Asisten Manajer") {
            gajiPokok = 10000000;
        } else {
            gajiPokok = 5000000;
        }

        let tunjanganJabatan = 15 / 100 * gajiPokok;
        let bpjs = 10 / 100 * gajiPokok;
        let tunjanganKeluarga = (status == "Menikah") ? 20 / 100 * gajiPokok : 0;

        let totalGaji = gajiPokok + tunjanganJabatan + bpjs + tunjanganKeluarga;

        document.write("<table>");

        document.write("<thead>");
        document.write("<tr>");
        document.write("<th>Nama Pegawai</th>");
        document.write("<th>Umur</th>");
        document.write("<th>Jabatan</th>");
        document.write("<th>Status</th>");
        document.write("<th>Gaji Pokok</th>");
        document.write("<th>Tunjangan Jabatan</th>");
        document.write("<th>BPJS</th>");
        document.write("<th>Tunjangan Keluarga</th>");
        document.write("</tr>");
        document.write("</thead>");

        document.write("<tbody>");
        document.write("<tr>");
        document.write("<td>" + namaPegawai + "</td>");
        document.write("<td>" + umur + " tahun</td>");
        document.write("<td>" + jabatan + "</td>");
        document.write("<td>" + status + "</td>");
        document.write("<td>Rp " + gajiPokok.toLocaleString("id-ID") + "</td>");
        document.write("<td>Rp " + tunjanganJabatan.toLocaleString("id-ID") + "</td>");
        document.write("<td>Rp " + bpjs.toLocaleString("id-ID") + "</td>");
        document.write("<td>Rp " + tunjanganKeluarga.toLocaleString("id-ID") + "</td>");
        document.write("</tr>");
        document.write("</tbody>");

        document.write("<tfoot>");
        document.write("<tr>");
        document.write("<td colspan='7'>Total Gaji</td>");
        document.write("<td>Rp " + totalGaji.toLocaleString("id-ID") + "</td>");
        document.write("</tr>");
        document.write("</tfoot>");

        document.write("</table>");

    </script>

</body>

</html>
